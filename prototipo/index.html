<title>Dimensions Stacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Figtree:wght@500;700;800&display=swap">
<style>
/* Nexo Dimensional: grafite profundo, marfim e metal discreto; brilho dimensional (ciano/violeta) só em elementos especiais.
   Tema único de propósito: um jogo de cartas noturno, sem versão clara. */
:root {
  --bg0: #0e0f13;
  --bg1: #15171c;
  --bg2: #1d2027;
  --ink: #ede7d6;
  --ink2: #a9a595;
  --gold: #d6cfba;
  --gold2: #f1ecdc;
  --metal: #d6cfba; --metal2: #f6f1e2; --metald: #8b8576;
  --nexus: #7fdcff; --nexus2: #b394ff;
  --line: #ffffff26;
  --f-disp: 'Cinzel', 'Trajan Pro', Georgia, 'Times New Roman', serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --p0: #ffd25f; --p1: #6cc6ff; --p2: #ff7ab0; --p3: #86f5a4;
  --back: linear-gradient(135deg, #2c3038, #0e0f13);
  color-scheme: dark;
}
[data-a="pod"] { --ac: #ff8a5c; }
[data-a="def"] { --ac: #6cc6ff; }
[data-a="int"] { --ac: #c58cff; }
[data-a="vel"] { --ac: #7dffb0; }
html, body { margin: 0; padding: 0; background: var(--bg0); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; }
noscript { display: block; padding: 24px; }
</style>
