<title>Dimensions Stacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Figtree:wght@500;700;800&display=swap">
<style>
/* Layout: uma tela única de aplicativo (menu, configuração, mesa). Mundo escuro e cósmico, ouro como acento.
   Tema único de propósito: um jogo de cartas noturno, sem versão clara. */
:root {
  --bg0: #07041a;
  --ink: #f2ecff;
  --ink2: #b3a6d9;
  --gold: #f4c95d;
  --gold2: #ffe39a;
  --line: #ffffff2b;
  --f-disp: 'Cinzel', 'Trajan Pro', Georgia, 'Times New Roman', serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --p0: #ffd25f; --p1: #6cc6ff; --p2: #ff7ab0; --p3: #86f5a4;
  --back: linear-gradient(135deg, #3b2490, #0d0822);
  color-scheme: dark;
}
[data-a="pod"] { --ac: #ff8a5c; }
[data-a="def"] { --ac: #6cc6ff; }
[data-a="int"] { --ac: #c58cff; }
[data-a="vel"] { --ac: #7dffb0; }
html, body { margin: 0; padding: 0; background: var(--bg0); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; }
noscript { display: block; padding: 24px; }
</style>
<link rel="stylesheet" href="styles.css">
<div id="app"></div>
<canvas id="fx"></canvas>
<script src="propostas.js"></script>
<script src="data.js"></script>
<script src="images.js"></script>
<script src="audio.js"></script>
<script src="especiais.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="game.js"></script>
<script>
  (function () {
    try { window.DSUI.boot(); } catch (e) { console.error(e); document.getElementById('app').textContent = 'Erro ao iniciar: ' + e.message; }
  })();
</script>
