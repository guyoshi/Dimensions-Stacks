<style>
/* Prisma: noite violeta com neon; cada atributo tem sua cor (Força coral, Resistência azul, Inteligência lilás, Velocidade verde).
   Tema único de propósito: um jogo de cartas noturno, sem versão clara. */
:root {
  --bg0: #0a0820;
  --bg1: #120e30;
  --bg2: #1a1540;
  --bg3: #231c52;
  --ink: #f4f1ff;
  --ink2: #b9b2ea;
  --gold: #ffc46b;
  --gold2: #fff1d4;
  --metal: #c9c2f5; --metal2: #ffffff; --metald: #6f66b5;
  --nexus: #4cc3ff; --nexus2: #c58cff;
  --coral: #ff8a5c; --pink: #ff4f9a; --violet: #8f5cff;
  --prism: linear-gradient(120deg, #ff8a5c, #ff4f9a 55%, #8f5cff);
  --line: #ffffff2a; --line2: #ffffff3d;
  --f-disp: 'Chakra Petch', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --p0: #ffd25f; --p1: #6cc6ff; --p2: #ff7ab0; --p3: #86f5a4;
  --back: linear-gradient(135deg, #2b2460, #0a0820);
  --mesh: radial-gradient(520px 380px at 10% 6%, #ff8a5c33, transparent 70%), radial-gradient(480px 360px at 96% 18%, #4cc3ff2e, transparent 70%), radial-gradient(560px 440px at 50% 52%, #8f5cff40, transparent 74%), radial-gradient(460px 340px at 82% 92%, #5dffb024, transparent 70%);
  color-scheme: dark;
}
[data-a="pod"] { --ac: #ff8a5c; }
[data-a="def"] { --ac: #6cc6ff; }
[data-a="int"] { --ac: #c58cff; }
[data-a="vel"] { --ac: #7dffb0; }
html, body { margin: 0; padding: 0; background: var(--bg0); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; }
noscript { display: block; padding: 24px; }
</style>
